# Model
model: yolov8n.pt

# Dataset
data: "datasets/vehicle_dataset/vehicle dataset/data.yaml"

# Training
epochs: 150
imgsz: 640
batch: 8
device: 0
workers: 0

# Optimizer
optimizer: AdamW
lr0: 0.001
momentum: 0.937
weight_decay: 0.0005

# Transfer Learning
pretrained: true

# Validation
val: true

# Performance
amp: true

# Saving
save: true
plots: true
name: yolov8n_vehicle_100e

# Early stopping
patience: 30
