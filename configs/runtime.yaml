# Model
model: "runs/detect/yolov8n.pt"

# Device
device: cpu

# YOLO
imgsz: 480
conf: 0.35

# Mode
mode: track

# Will be used later when mode = track
tracker: ocsort

# Detection timing
detection_mode: continuous
detection_interval: 0.2

# Source
source_type: webcam
source: 0

# Output
show: true
save_video: false
save_csv: true
